name: Test and Deploy Auth Service

on:
  push:
    branches:
      - Dev
    paths:
      - '.dockerignore'
      - '.github/workflows/deploy-azure-app-service.yml'
      - 'docker/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'Medzo.Auth.sln'
      - 'dotnet-tools.json'
  workflow_dispatch:

concurrency:
  group: medzo-auth-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: medzo-pharmacy/medzo-user-auth-service
  CONTAINER_APP_NAME: medzo-auth-service
  RESOURCE_GROUP: rg-MEDZO-NEW

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and test
        run: |
          dotnet restore Medzo.Auth.sln
          dotnet test Medzo.Auth.sln --configuration Release --no-restore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Validate Azure OpenID Connect variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Add repository Actions variable AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Add repository Actions variable AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Add repository Actions variable AZURE_SUBSCRIPTION_ID}"

      - name: Log in to Azure using OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update existing Auth Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --output none

      - name: Verify deployed health endpoint
        uses: azure/cli@v2
        with:
          inlineScript: |
            fqdn=$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query 'properties.configuration.ingress.fqdn' \
              --output tsv)
            test -n "$fqdn"
            curl --fail --retry 6 --retry-all-errors --retry-delay 10 "https://$fqdn/health"
